name: Build Unigram

on:
  push:
    branches: [ develop ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    # UWP 构建强烈建议使用 Windows Server 2022 或更新版本
    runs-on: windows-2022

    steps:
      - name: Checkout repository (recursive for submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # ⚠️ 关键：注入 Telegram API 凭证
      # 你需要在 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中
      # 添加 TELEGRAM_API_ID 和 TELEGRAM_API_HASH 两个 Secret
      - name: Create Constants.Secret.cs
        shell: pwsh
        run: |
          $secretFile = "Unigram\Telegram\Constants.Secret.cs"
          $content = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = ${{ secrets.TELEGRAM_API_ID }};
                      ApiHash = "${{ secrets.TELEGRAM_API_HASH }}";
                      AppChannel = "UnigramDev";
                  }
              }
          }
          "@
          Set-Content -Path $secretFile -Value $content -Encoding UTF8

      # ⚠️ 极其复杂的依赖处理步骤 (此处仅示意，实际极易出错)
      # 官方要求克隆特定 commit 的 vcpkg，打补丁，并修改 ffmpeg 的 portfile
      # 在 CI 环境中，TDLib 的编译通常需要数十分钟甚至更久，且容易因环境差异失败
      - name: Setup vcpkg (Reference only)
        shell: pwsh
        run: |
          # 注意：官方文档中 vcpkg 的 commit 和补丁步骤非常繁琐
          # 这里仅做一个最简单的克隆示意，实际需要参照官方 Build-instructions.md 进行 checkout 和 patch
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          # 官方要求设置 VCPKG_ROOT 环境变量（新版流程）或运行 integrate install（旧版流程）
          echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore Unigram.sln

      # ⚠️ 构建 UWP 项目
      # 官方并未提供直接的 MSBuild 命令来生成 .exe，而是生成 .msix 包
      # 这里使用通用的 MSBuild 命令尝试构建 Release 版本
      - name: Build Solution
        run: |
          msbuild Unigram.sln /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Always /p:AppxPackageSigningEnabled=false
        # 注意：如果不签名，生成的包在安装时会有问题

      # 上传构建产物 (通常是 .msix 或 .msixbundle)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-Build
          path: |
            **\AppPackages\**
            **\*.msix
            **\*.msixbundle
